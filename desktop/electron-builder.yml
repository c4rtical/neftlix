appId: it.neftlix.app
productName: Neftlix
electronVersion: 44.3.0
copyright: MIT — c4rtical
directories:
  output: release
  buildResources: build
files:
  - dist/**/*
  - package.json
asar: true
asarUnpack:
  - dist/web/**
npmRebuild: false
mac:
  category: public.app-category.entertainment
  target:
    - target: dmg
      arch: [universal]
  identity: null
  hardenedRuntime: false
  gatekeeperAssess: false
  artifactName: "Neftlix-${version}-universal.${ext}"
win:
  target:
    - target: nsis
      arch: [x64]
  artifactName: "Neftlix-Setup-${version}.${ext}"
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
publish:
  provider: github
  owner: c4rtical
  repo: neftlix
  releaseType: draft
