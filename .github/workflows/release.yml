name: Release

# Runs on every push to main. If package.json carries a version that has no tag yet,
# the tag vX.Y.Z is created here and the desktop installers are built and attached to a
# draft GitHub release. Pushing without bumping the version does nothing.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.decide.outputs.release }}
      tag: ${{ steps.decide.outputs.tag }}
      version: ${{ steps.decide.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: decide
        name: Create the version tag when it does not exist yet
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v$VERSION"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_REF}" = "refs/tags/$TAG" ]; then
            echo "release=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists: nothing to release."
            echo "release=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Neftlix $VERSION"
          git push origin "$TAG"
          echo "release=true" >> "$GITHUB_OUTPUT"
      # One draft, created here before the matrix starts: when each electron-builder job
      # creates its own, the macOS and Windows runs race and end up with two drafts for the
      # same tag. The notes are the CHANGELOG section of this version.
      - name: Create the draft release with the changelog notes
        if: steps.decide.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.decide.outputs.tag }}
          VERSION: ${{ steps.decide.outputs.version }}
        run: |
          if gh release view "$TAG" --json id >/dev/null 2>&1; then
            echo "Release $TAG already exists."; exit 0
          fi
          awk -v v="$VERSION" '
            index($0, "## [" v "]") == 1 { on = 1; next }
            /^## \[/ { on = 0 }
            on { print }
          ' CHANGELOG.md | sed -e :a -e '/^\n*$/{$d;N;ba' -e '}' > notes.md
          [ -s notes.md ] || echo "Neftlix $VERSION" > notes.md
          gh release create "$TAG" --draft --title "Neftlix $VERSION" --notes-file notes.md

  desktop:
    needs: version
    if: needs.version.outputs.release == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run release --workspace=desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
