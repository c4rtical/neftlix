name: Docker

# Publishes ghcr.io/c4rtical/neftlix. ":edge" on every push to main; ":latest" and ":X.Y.Z"
# as well when the push is a release (package.json carries a version whose
# tag vX.Y.Z is missing or points at this commit; release.yml creates that tag). The tag
# push itself cannot be the trigger: tags created by a workflow with GITHUB_TOKEN do not
# start other workflows. The image is what README and docker-compose.yml pull.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: ver
        name: Decide whether this commit is a release
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          TAGGED=$(git ls-remote --tags origin "refs/tags/v$VERSION^{}" | cut -f1)
          if [ -z "$TAGGED" ] || [ "$TAGGED" = "$GITHUB_SHA" ]; then
            echo "release=true" >> "$GITHUB_OUTPUT"; echo "release $VERSION"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"; echo "not a release (v$VERSION is $TAGGED)"
          fi
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=edge
            type=raw,value=latest,enable=${{ steps.ver.outputs.release == 'true' }}
            type=raw,value=${{ steps.ver.outputs.version }},enable=${{ steps.ver.outputs.release == 'true' }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
